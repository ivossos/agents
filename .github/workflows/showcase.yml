name: Build & Deploy Showcase

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/build-showcase.js'
      - '.github/workflows/showcase.yml'
  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: write      # needed to commit docs/index.html back to the branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build showcase
        run: node scripts/build-showcase.js

      - name: Commit generated docs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "chore: rebuild showcase [skip ci]"
          git push
